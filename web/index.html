<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The board is drawn to fit the page at the screen's own resolution, so
       there is nothing to zoom into and nothing to pan. Pinch and double-tap
       zoom are turned off because on a phone they fire instead of the taps
       the game is waiting for. viewport-fit=cover lets the table run under
       the notch. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#008000">
  <!-- Added to a phone's home screen, the game opens without browser chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>cellmate</title>
  <style>
    html, body {
      margin: 0;
      /* A phone's address bar shrinks and grows as the page scrolls, and
         100% of it moves with it. The dynamic viewport height is what the
         window actually shows. */
      height: 100dvh;
      background: #008000;
      overflow: hidden;
      /* The board takes every gesture itself, so nothing here scrolls,
         rubber-bands, shows a selection, or flashes on tap. */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The board is drawn at the top of the page, so on a phone whose status
       bar or notch overlays the page it would begin underneath them. The
       inset keeps the menu bar clear of them; the table's green is the page
       background, so it still runs under them. */
    body {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
    }
    #status {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 14px monospace; color: #fff;
    }
    /* The board is 4 by 3, so a phone held upright shows it at less than half
       the height it gets on its side. The hint sits in the empty green below
       the board and takes no taps, so it never comes between a finger and a
       card. */
    #rotate {
      position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom, 0px));
      text-align: center; font: 13px monospace; color: rgba(255, 255, 255, .75);
      pointer-events: none; display: none;
    }
    @media (orientation: portrait) and (max-width: 560px) {
      #rotate { display: block; }
    }
  </style>
</head>
<body>
  <div id="status">Loading cellmate...</div>
  <p id="rotate">Turn your phone sideways for a bigger board</p>
  <script src="wasm_exec.js"></script>
  <script>
    const status = document.getElementById("status");

    // The game is a single WebAssembly file of several megabytes, so show
    // how much has arrived. The response body is split in two: one half is
    // compiled as it streams in, the other is only counted. Counting bytes
    // rather than a percentage keeps the figure honest when the server
    // compresses the file, since Content-Length is then the compressed size.
    async function load() {
      const res = await fetch("cellmate.wasm");
      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }
      const [compile, count] = res.body.tee();
      (async () => {
        const reader = count.getReader();
        let bytes = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) {
            break;
          }
          bytes += value.length;
          status.textContent = "Loading cellmate... " + (bytes / 1e6).toFixed(1) + " MB";
        }
      })();
      const go = new Go();
      const wasm = new Response(compile, { headers: { "Content-Type": "application/wasm" } });
      const result = await WebAssembly.instantiateStreaming(wasm, go.importObject);
      status.remove();
      go.run(result.instance);
    }

    load().catch((err) => {
      status.textContent = "Could not load cellmate: " + err;
    });
  </script>
</body>
</html>
