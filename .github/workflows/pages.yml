name: Pages

# Publishes the browser build to GitHub Pages. Called from tag.yml, so the
# playable site always matches the latest release.

on:
  workflow_call:

jobs:
  pages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make build_wasm

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

      - id: deploy
        uses: actions/deploy-pages@v5
